<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой любимый сказочный герой — Театр LIBERTAD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Главный экран -->
  <div id="welcome-screen" class="screen active">
    <div class="welcome-content">
      <h1>🎭 Мой любимый сказочный герой</h1>
      <p>Пройди три испытания и узнай, какой сказочный герой тебе больше всего нравится!</p>
      <button id="start-quest-btn" class="btn btn-lg">Начать квест ✦</button>
    </div>
  </div>

  <!-- Экран викторины -->
  <div id="quiz-screen" class="screen">
    <div id="quiz-container"></div>
  </div>

  <!-- Экран мемо -->
  <div id="memory-screen" class="screen">
    <div class="memory-header">
      <h2>Этап 2: Память героя</h2>
      <p>Найди все пары персонажей</p>
      <div class="moves-display">Ходов осталось: <span id="moves-count">25</span></div>
    </div>
    <div id="memory-grid" class="memory-grid"></div>
  </div>

  <!-- Экран сундука -->
  <div id="chest-screen" class="screen">
    <div id="chest-container"></div>
  </div>

  <!-- Финальный экран -->
  <div id="final-screen" class="screen">
    <div id="final-container"></div>
  </div>

  <!-- Модальное окно -->
  <div id="game-emodal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title"></h2>
      <p id="modal-message"></p>
      <button id="modal-btn" class="btn btn-lg">OK</button>
    </div>
  </div>

  <!-- Панель настроек -->
  <div id="settings-panel" class="settings-panel" style="display: none;">
    <h3>Настройки</h3>
    <label>Промокод:
      <input type="text" id="promo-input" value="FAIRY20">
    </label>
    <label>Ссылка на билеты:
      <input type="text" id="link-input" value="https://example.com/tickets">
    </label>
    <button id="save-settings" class="btn">Сохранить</button>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>

  <footer class="site-footer">
    Сделано в театре-лаборатории <a href="https://libertad-theater.ru" target="_blank" rel="noopener">LIBERTAD</a>, 2026
  </footer>
</body>
</html>
